name: Refresh download links
on:
  release:
    types: [published, released]
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-links.yml'
      - 'Scripts/**'
      - '(C) Download Page Template.md'
permissions:
  contents: read
concurrency:
  group: lockin-download-page
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify link generation and safe failure behavior
        run: python3 'Scripts/download-page-tests.py'
  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh each platform's front-page link from verified release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --ff-only origin main
          python3 'Scripts/download-page.py' --repo "$GITHUB_REPOSITORY" --output README.md
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'Refresh Mac and Windows download links'
          git push origin HEAD:main
